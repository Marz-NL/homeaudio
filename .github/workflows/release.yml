# Builds the prebuilt aarch64 binaries install.sh downloads, and attaches them
# to a GitHub release: push a tag (git tag v0.1.0 && git push --tags), or run
# it by hand from the Actions tab with a tag name.
#
# Built natively on an arm64 runner, inside Debian trixie - the same OS the
# Pis run, so the binaries link against the same libraries.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  SPOTIFYD_VERSION: v0.4.2   # keep in sync with lib/sources/spotify.sh
  PIBUZ_COMMIT: 8184ba3c491bf6ccbecc4c138f0a20ae3bb3d212   # 2.6.0; keep in sync with lib/sources/qobuz.sh (pibuz publishes no binaries)
  ALSA_CDSP_COMMIT: 1a1b0a3e452f87372881ffaa9391a11d0ff6d541   # keep in sync with lib/output.sh

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git curl ca-certificates \
            libasound2-dev libdbus-1-dev libssl-dev libjack-jackd2-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5

      - name: playerui and player-guard-helper
        working-directory: webui
        run: |
          cargo build --release --locked -p playerui -p player-guard-helper
          # full license text of every crate linked into the two binaries
          cargo install -q --locked cargo-about --features cli
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt

      - name: spotifyd (upstream + patches/spotifyd-linear-volume.patch)
        run: |
          git clone -q --depth 1 --branch "$SPOTIFYD_VERSION" https://github.com/Spotifyd/spotifyd /tmp/spotifyd
          git -C /tmp/spotifyd apply "$GITHUB_WORKSPACE/patches/spotifyd-linear-volume.patch"
          cd /tmp/spotifyd
          cargo build --release --locked --no-default-features --features alsa_backend,dbus_mpris

      - name: pibuz (upstream commit, unchanged)
        run: |
          git clone -q https://github.com/PhilipVinc/pibuz /tmp/pibuz
          git -C /tmp/pibuz checkout -q "$PIBUZ_COMMIT"
          cd /tmp/pibuz
          cargo build --release --locked -p pibuz

      - name: alsa_cdsp (ALSA plugin that feeds CamillaDSP, upstream commit + patches/alsa-cdsp-homeaudio.patch)
        run: |
          git clone -q https://github.com/scripple/alsa_cdsp /tmp/alsa_cdsp
          git -C /tmp/alsa_cdsp checkout -q "$ALSA_CDSP_COMMIT"
          git -C /tmp/alsa_cdsp apply "$GITHUB_WORKSPACE/patches/alsa-cdsp-homeaudio.patch"
          make -s -C /tmp/alsa_cdsp

      - name: Collect assets
        run: |
          mkdir dist
          cp webui/target/release/playerui              dist/playerui-linux-aarch64
          cp webui/target/release/player-guard-helper   dist/player-guard-helper-linux-aarch64
          cp /tmp/spotifyd/target/release/spotifyd      dist/spotifyd-linux-aarch64
          cp /tmp/pibuz/target/release/pibuz            dist/pibuz-linux-aarch64
          cp /tmp/pibuz/LICENSE*                        dist/PIBUZ-LICENSE.txt
          cp /tmp/alsa_cdsp/libasound_module_pcm_cdsp.so dist/libasound_module_pcm_cdsp-linux-aarch64.so
          cp /tmp/alsa_cdsp/LICENSE                     dist/ALSA-CDSP-LICENSE.txt
          cp patches/alsa-cdsp-homeaudio.patch          dist/
          cp patches/spotifyd-linear-volume.patch       dist/
          cp webui/THIRD-PARTY-LICENSES.txt             dist/
          cat > dist/SPOTIFYD-SOURCE.md <<EOF
          spotifyd-linux-aarch64 is spotifyd $SPOTIFYD_VERSION (GPL-3.0,
          https://github.com/Spotifyd/spotifyd) with spotifyd-linear-volume.patch
          applied, built with:
            cargo build --release --locked --no-default-features --features alsa_backend,dbus_mpris
          Its complete source is that tag plus the patch in this release.
          EOF
          cd dist
          for f in *-linux-aarch64; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          apt-get install -y -qq gh >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Prebuilt aarch64 binaries for install.sh."
          gh release upload "$TAG" dist/* --clobber
