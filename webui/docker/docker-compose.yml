# A pure "hub" viewer of the real rooms - no local player-guard-helper, no
# audio hardware, no secrets. Run on any always-on machine:
#
#   cp config/hub.example.toml config/hub.toml   # rooms are found by themselves
#   cd docker && docker compose up -d --build
#
# Then open http://<this host>:8189 - it shows every room, each fetched live
# straight from the browser, exactly like opening a Pi's own playerui page
# directly. This container is just another place to load the same static
# page; it holds no state of its own.
#
# Local additions (labels for a dashboard, another port, ...) go in
# docker-compose.override.yml next to this file; Compose reads it by itself
# and git ignores it.
services:
  playerui-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: playerui-hub
    restart: unless-stopped
    ports:
      - "8189:8189"
    volumes:
      # Editing the rooms list only needs a container restart, not a rebuild.
      - ../config/hub.toml:/config/hub.toml:ro
      # Rooms found by themselves: the host's avahi-daemon, over D-Bus (no
      # host networking needed). Without avahi on the host, drop this line
      # and list the rooms in hub.toml instead.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
