# A pure "hub" viewer of the real rooms - no local player-guard-helper, no
# audio hardware, no secrets. Run on any always-on machine:
#
#   cp config/hub.example.toml config/hub.toml   # list your rooms
#   cd docker && docker compose up -d --build
#
# Then open http://<this host>:8189 - it shows every room, each fetched live
# straight from the browser, exactly like opening a Pi's own playerui page
# directly. This container is just another place to load the same static
# page; it holds no state of its own.
services:
  playerui-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: playerui-hub
    restart: unless-stopped
    ports:
      - "8189:8189"
    volumes:
      # Editing the rooms list only needs a container restart, not a rebuild.
      - ../config/hub.toml:/config/hub.toml:ro
